<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RePermit demo</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f4f5f7; --surface: #fff; --border: #dfe3e8; --text: #1c2430; --muted: #5d6877;
  --accent: #1f5fbf; --accent-text: #fff; --ai: #6a3fb5; --ai-bg: #f3eefb;
  --ok: #17703f; --ok-bg: #e4f4ea; --warn: #8a5a00; --warn-bg: #fdf2d8;
  --bad: #ab2a2a; --bad-bg: #fbe6e6; --info: #1f5fbf; --info-bg: #e6effb; --neutral-bg: #eceff3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12161c; --surface: #1b2129; --border: #2f3743; --text: #e7ebf0; --muted: #9aa5b3;
    --accent: #6ea4f0; --accent-text: #10151b; --ai: #bb9df0; --ai-bg: #2a2340;
    --ok: #6fd39b; --ok-bg: #16352a; --warn: #eec25f; --warn-bg: #3a2f12;
    --bad: #f29a9a; --bad-bg: #40201f; --info: #8db9f5; --info-bg: #1b2d47; --neutral-bg: #272e38;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
header.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
header.top h1 { font-size: 18px; margin: 0; }
header.top .tag { color: var(--muted); font-size: 14px; }
header.top .role { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; padding: 16px 20px; align-items: start; }
aside { display: grid; gap: 16px; }
main { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.panel.ai { border-color: var(--ai); }
a, a:visited { color: var(--info); }
h2 { font-size: 15px; margin: 0 0 8px; }
h3 { font-size: 14px; margin: 14px 0 6px; }
p { margin: 4px 0; }
.muted { color: var(--muted); font-size: 13px; }
.ai-label { color: var(--ai); font-weight: 600; }
button, select, input, textarea { font: inherit; color: inherit; }
select, input, textarea { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; width: 100%; }
header.top select { width: auto; }
button { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
button.ai { color: var(--ai); border-color: var(--ai); font-weight: 600; }
button:disabled { opacity: .55; cursor: wait; }
.scenario, .case-row { display: block; width: 100%; text-align: left; padding: 8px 10px; margin-bottom: 6px; }
.scenario .title, .case-row .title { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.case-row.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
header.top nav { display: flex; gap: 4px; }
header.top nav a, nav.tabs a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 14px; }
header.top nav a:hover, nav.tabs a:hover { background: var(--neutral-bg); color: var(--text); }
header.top nav a.active { background: var(--accent); color: var(--accent-text); }
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
nav.tabs a { border-radius: 6px 6px 0 0; }
nav.tabs a.active { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
#page { display: grid; gap: 16px; padding: 16px 20px; }
[hidden] { display: none !important; }
.scroll { max-height: 42vh; overflow-y: auto; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; flex: none; align-self: flex-start; background: var(--neutral-bg); color: var(--muted); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.info { background: var(--info-bg); color: var(--info); }
.badge.ai { background: var(--ai-bg); color: var(--ai); }
.case-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.case-head h2 { font-size: 18px; margin: 0; }
.stages { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.stage { flex: 1 1 130px; padding: 6px 10px; border-radius: 6px; background: var(--neutral-bg); color: var(--muted); font-size: 13px; }
.stage.done { background: var(--ok-bg); color: var(--ok); }
.stage.current { background: var(--accent); color: var(--accent-text); font-weight: 600; }
.replay-note { background: var(--warn-bg); color: var(--warn); padding: 6px 10px; border-radius: 6px; margin-top: 10px; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 13px; }
th, td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--border); vertical-align: top; }
.request { border-top: 1px solid var(--border); padding: 8px 0; }
.request:first-of-type { border-top: 0; }
.answer { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.answer select { width: auto; }
.answer input[type=file] { width: auto; flex: 1 1 200px; }
label.answer { align-items: center; font-size: 14px; }
.issue { background: var(--bad-bg); border-radius: 6px; padding: 8px 10px; margin-top: 8px; }
ol.timeline { list-style: none; margin: 8px 0 0; padding: 0; }
ol.timeline li { border-left: 2px solid var(--border); padding-left: 12px; margin-left: 6px; }
ol.timeline button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; }
ol.timeline li.future { opacity: .45; }
ol.timeline li.current button { background: var(--info-bg); }
ol.timeline li.ai { border-left-color: var(--ai); }
ol.timeline li.bad { border-left-color: var(--bad); }
ol.timeline li.ok { border-left-color: var(--ok); }
ol.timeline details { margin: 0 8px 8px; }
ol.timeline details summary { cursor: pointer; font-size: 13px; }
dl.basis { margin: 6px 0 0; display: grid; grid-template-columns: minmax(120px, 180px) 1fr; gap: 4px 12px; font-size: 13px; }
dl.basis dt { font-weight: 600; }
dl.basis dd { margin: 0; }
dl.basis ul { margin: 0; padding-left: 18px; }
dl.basis ul li { border-left: 0; padding-left: 0; margin: 0 0 2px; }
@media (max-width: 640px) { dl.basis { grid-template-columns: 1fr; } }
.step-title { font-weight: 600; }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.empty { padding: 48px 16px; text-align: center; color: var(--muted); }
.notice { padding: 8px 20px 20px; color: var(--muted); font-size: 13px; }
#toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); max-width: min(640px, calc(100% - 32px)); padding: 10px 14px; border-radius: 6px; background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad); display: none; }
#toast.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
dialog { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; width: min(520px, calc(100% - 32px)); }
dialog label { display: block; margin-top: 10px; font-size: 14px; }
dialog { max-height: calc(100vh - 32px); overflow-y: auto; }
.kb { display: grid; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr) minmax(0, 1.2fr); gap: 16px; align-items: start; }
.kb-sources { display: grid; gap: 2px; max-height: 75vh; overflow-y: auto; }
.kb-sources button, .kb-row { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; }
.kb-sources button { display: flex; justify-content: space-between; gap: 8px; }
.kb-sources button span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kb-sources button.active, .kb-row.active { background: var(--info-bg); }
.kb-search { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.kb-search input { flex: 1 1 200px; }
.kb-snippet { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kb-pager { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.kb-detail { position: sticky; top: 12px; max-height: 80vh; overflow-y: auto; }
.kb-detail h3 { margin-top: 0; }
.kb-text { white-space: pre-wrap; line-height: 1.5; font-size: 14px; }
@media (max-width: 900px) { .kb { grid-template-columns: 1fr; } .kb-sources { max-height: none; } .kb-detail { position: static; max-height: none; } }
dialog details summary { cursor: pointer; margin-top: 10px; }
dialog label.check { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; }
dialog label.check input { width: auto; margin-top: 3px; }
dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  header.top { padding: 12px 16px; }
  .scroll { max-height: none; }
}
</style>
</head>
<body>
<header class="top">
  <h1>RePermit demo</h1>
  <nav id="nav" aria-label="Main"></nav>
  <label class="role">Acting as <select id="role"></select></label>
</header>
<div class="layout" id="cases-page">
  <aside>
    <section class="panel">
      <h2>Test cases</h2>
      <p class="muted">Start a test case. The AI cases call Claude and take up to a minute.</p>
      <div id="scenarios" class="scroll"></div>
      <button id="own" class="ai">Submit your own request</button>
    </section>
    <section class="panel">
      <h2>Started cases</h2>
      <div id="cases" class="scroll"></div>
    </section>
  </aside>
  <main id="main"><div class="panel empty">Choose a test case on the left to see the flow.</div></main>
</div>
<div id="page" hidden></div>
<p class="notice" id="notice"></p>
<div id="toast" role="status"></div>
<dialog id="dialog"></dialog>

<script>
const LABELS = {
  status: { open: "Open", pending_evidence: "Waiting for information", escalated: "Escalated", awaiting_review: "Waiting for review", ready: "Ready", completed: "Completed" },
  statusClass: { open: "", pending_evidence: "warn", escalated: "bad", awaiting_review: "info", ready: "info", completed: "ok" },
  stage: { design_change: "Design change", package_prepared: "Package prepared", under_review: "Under review", approved_simulated: "Approved (simulated)" },
  domain: { architectural: "Architecture", structural: "Structure", fire_safety: "Fire safety", general: "General", permitting: "Permitting", planning: "Planning", heritage: "Heritage", property: "Property" },
  domainStatus: { affected: "Affected", potentially_affected: "Potentially affected", not_affected: "Not affected" },
  domainClass: { affected: "bad", potentially_affected: "warn", not_affected: "ok" },
  action: { prepare_review_package: "Prepare review package", submit_for_review: "Submit for review", approve_modification: "Approve modification" },
  actionHelp: {
    prepare_review_package: "Bundles the design change and its evidence into a review package. This is not a permit decision.",
    submit_for_review: "Sends the package to the authority for review.",
    approve_modification: "The authority approves the modification. In this demo the approval is simulated.",
  },
  autonomy: { autonomous: "May run automatically", human_review: "Human review required", human_only: "Humans only" },
  role: { consultant: "Consultant", coordinator: "Coordinator", authority: "Authority", observer: "Observer" },
  issue: { rule_conflict: "Rules contradict each other", process_gap: "Process gap", retrieval_gap: "Not covered by the rules", llm_flag: "AI sees a risk outside the rules", llm_unavailable: "AI review unavailable", ai_stopped: "AI review stopped: a reviewer takes over" },
  aiStop: { round_limit: "the review round limit is reached", case_budget: "the AI budget of this case is spent", daily_budget: "the daily AI budget is spent" },
  deficiency: { missing: "Missing", insufficient: "Insufficient", outdated: "Expired", revision_unknown: "Revision unknown", stale_revision: "Belongs to an old revision", unknown_fact: "Not yet known", inconsistent_fact: "Contradictory", ai_question: "AI question", document_pending: "Waiting for assessment", document_incomplete: "Incomplete", fact_to_confirm: "Answer read from a document" },
  impact: { retained: "Still valid", review: "Check", revalidate: "Revalidate" },
  subject: {
    floor_plan: "Floor plan", design_model: "Design model (IFC)", baseline_model: "Baseline model (IFC)", fire_strategy: "Fire strategy", structural_assessment: "Structural assessment",
    load_bearing: "Is the wall load-bearing?", fire_compartment_boundary: "Is the wall a fire compartment boundary?", occupancy: "What is the building used for?",
  },
  reason: { not_authorized: "role lacks permission", held: "action is on hold", not_available: "action is not next in the process" },
};
const OCCUPANCY = [["residential", "Residential"], ["mixed_use", "Mixed use"], ["commercial", "Commercial"]];
const label = (group, key) => LABELS[group][key] || key;
const subject = (key) => ((state.latest && state.latest.labels) || {})[key] || label("subject", key);
const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (value === true) node.setAttribute(key, "");
    else if (value !== false && value != null) node.setAttribute(key, value);
  }
  for (const child of children.flat()) {
    if (child != null && child !== false) node.append(child);
  }
  return node;
}

const badge = (text, cls = "") => el("span", { class: `badge ${cls}` }, text);

function errorMessage(status, detail) {
  const text = Array.isArray(detail) ? detail.map((item) => item.msg).join("; ") : String(detail);
  if (status === 403) return "Refused: this role lacks permission. The refusal is recorded in the flow.";
  if (status === 409) return "Not possible now: the action is on hold or not next in the process. The refusal is recorded in the flow.";
  if (text.includes("BIM")) return "Refused: a new building permit must be delivered in BIM (IFC).";
  return `Something went wrong (${status}): ${text}`;
}

async function api(path, method = "GET", body) {
  const response = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(errorMessage(response.status, data.detail));
  return data;
}

let toastTimer;
function toast(message, ok = false) {
  const node = $("toast");
  node.textContent = message;
  node.className = ok ? "ok" : "";
  node.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { node.style.display = "none"; }, 7000);
}

const emptyDraft = () => ({ facts: {}, answers: {}, documents: {}, note: "" });
const state = { page: "cases", tab: "overview", afterRoute: null, draft: emptyDraft(), meta: null, ruleUrls: {}, role: "consultant", cases: [], caseId: null, view: null, latest: null, history: [], at: null, timer: null };

async function run(button, text, work) {
  const original = [...button.childNodes];
  button.disabled = true;
  if (text) button.textContent = text;
  try {
    await work();
  } catch (error) {
    toast(error.message);
    await refresh();
  } finally {
    button.disabled = false;
    button.replaceChildren(...original);
  }
}

async function loadLists() {
  state.cases = await api("/cases");
  $("cases").replaceChildren(...(state.cases.length ? state.cases.map(caseRow) : [el("p", { class: "muted" }, "No cases yet.")]));
}

function caseRow(item) {
  return el("button", {
    class: `case-row ${item.case_id === state.caseId ? "active" : ""}`,
    onclick: () => openCase(item.case_id),
  },
    el("span", { class: "title" }, item.project_name.replace("[SYNTHETIC] ", ""), badge(label("status", item.status), LABELS.statusClass[item.status])),
    el("span", { class: "muted" }, label("stage", item.stage)));
}

function scenarioRow(item) {
  return el("button", {
    class: "scenario",
    disabled: !item.available,
    onclick: (event) => run(event.currentTarget, item.live ? "Claude is reviewing…" : "Working…", async () => {
      const created = await api(`/demo/scenarios/${item.id}`, "POST");
      await openCase(created.case_id);
    }),
  },
    el("span", { class: "title" }, item.title, badge(item.flow, item.live ? "ai" : "")),
    el("span", { class: "muted" }, item.available ? `${item.summary}${item.expected_type ? ` Expected type: ${item.expected_type}.` : ""}` : "Requires a configured LLM."));
}

async function openCase(caseId) {
  const target = `#/case/${caseId}`;
  state.view = null;
  if (location.hash === target) await route();
  else {
    // route() runs on hashchange. Started cases open as soon as it has loaded them.
    await new Promise((resolve) => { state.afterRoute = resolve; location.hash = target; });
  }
}

async function refresh() {
  await loadLists();
  if (!state.caseId) return;
  [state.latest, state.history] = await Promise.all([api(`/cases/${state.caseId}`), api(`/cases/${state.caseId}/history`)]);
  state.view = state.at ? await api(`/cases/${state.caseId}?at=${state.at}`) : state.latest;
  render();
}

async function showStep(step) {
  state.at = step >= state.history.length ? null : step;
  state.view = state.at ? await api(`/cases/${state.caseId}?at=${state.at}`) : state.latest;
  render();
}

function stopPlaying() {
  clearInterval(state.timer);
  state.timer = null;
}

function togglePlay() {
  if (state.timer) {
    stopPlaying();
    render();
    return;
  }
  showStep(state.at ? state.at : 1);
  if (!state.at && state.history.length > 1) state.at = 1;
  state.timer = setInterval(() => {
    if (!state.at) { stopPlaying(); render(); return; }
    showStep(state.at + 1);
  }, 1300);
}

const CASE_TABS = [["overview", "Overview"], ["model", "BIM model"], ["documents", "Documents"], ["rules", "Rules and AI"], ["flow", "Flow"]];

function caseTabs(view) {
  const open = view.assessment ? view.assessment.deficiencies.length + view.assessment.issues.length : 0;
  return el("nav", { class: "tabs" }, CASE_TABS
    .filter(([key]) => key !== "model" || view.bim_required)
    .map(([key, text]) => el("a", { href: `#/case/${view.case_id}/${key}`, class: state.tab === key ? "active" : "" },
      text, key === "overview" && open ? ` (${open})` : "")));
}

function tabSections(view, readOnly) {
  if (state.tab === "model" && view.bim_required) return [bimPanel(view, readOnly)];
  if (state.tab === "flow") return [flowPanel()];
  if (state.tab === "documents") {
    const documents = view.evidence.some((item) => item.document && view.document_specs[item.type]);
    const panels = [documents ? documentPanel(view, readOnly) : null, view.evidence.length ? evidencePanel(view) : null].filter(Boolean);
    return panels.length ? panels : [el("div", { class: "panel muted" }, "No documents yet.")];
  }
  if (!view.assessment) return [el("div", { class: "panel muted" }, "At this point the rules have not assessed the modification yet. Choose a later step in the flow.")];
  if (state.tab === "rules") return [domainPanel(view)];
  const left = [nextStepPanel(view, readOnly), informationPanel(view, readOnly)];
  return [el("div", { class: "grid2" }, el("div", { style: "display:grid;gap:16px;align-content:start" }, left), aiPanel(view, readOnly))];
}

function render() {
  const view = state.view;
  const readOnly = state.at !== null;
  $("main").replaceChildren(headerPanel(view, readOnly), caseTabs(view), ...tabSections(view, readOnly));
}

const PAGES = { cases: "Cases", rules: "Rules", sources: "Sources", knowledge: "Knowledge", settings: "Settings" };

function renderNav() {
  $("nav").replaceChildren(...Object.entries(PAGES).map(([key, text]) => el("a", { href: key === "cases" ? "#/" : `#/${key}`, class: state.page === key ? "active" : "" }, text)),
    el("a", { href: "/docs", target: "_blank", rel: "noopener" }, "API"));
  $("cases-page").hidden = state.page !== "cases";
  $("page").hidden = state.page === "cases";
}

function table(headers, rows) {
  return el("div", { style: "overflow-x:auto" }, el("table", {},
    el("thead", {}, el("tr", {}, headers.map((text) => el("th", {}, text)))),
    el("tbody", {}, rows.map((row) => el("tr", {}, row.map((cell) => el("td", {}, cell)))))));
}

const sourceLink = (title, url) => (url ? el("a", { href: url, target: "_blank", rel: "noopener" }, title) : title);

async function renderRulesPage() {
  const data = await api("/knowledge");
  $("page").replaceChildren(
    el("section", { class: "panel" }, el("h2", {}, `Rules: ${data.pack_version}`),
      el("p", { class: "muted" }, "Derived from public sources. These are interpretations, not official logic, and no expert has confirmed them."),
      table(["Rule", "Domain", "What it says", "Requires", "Source"], data.rules.map((rule) => [
        el("strong", {}, rule.id), label("domain", rule.domain), el("div", {}, el("strong", {}, rule.title), el("div", { class: "muted" }, rule.text)),
        rule.requires_evidence.map(subjectIn(data)).join(", ") || "–", sourceLink(rule.reference, rule.source_url),
      ]))),
    el("section", { class: "panel" }, el("h2", {}, "Known gaps"), el("p", { class: "muted" }, "These always go to a reviewer."),
      table(["Gap", "When", "What it means"], data.gaps.map((gap) => [el("strong", {}, gap.id), Object.entries(gap.when).map(([key, value]) => `${key} = ${value}`).join(", "), gap.description]))),
    el("section", { class: "panel" }, el("h2", {}, "Document checklists"), el("p", { class: "muted" }, "What each document must contain. A document is complete only when every item is present."),
      table(["Document", "Must contain", "Can prove"], data.documents.map((item) => [el("strong", {}, subjectIn(data)(item.type)), item.must_contain.join("; "), item.proves.join(", ") || "–"]))));
}

const subjectIn = (data) => (key) => data.labels[key] || key;

async function renderSourcesPage() {
  const data = await api("/knowledge");
  $("page").replaceChildren(
    el("section", { class: "panel" }, el("h2", {}, "Sources for retrieval"),
      el("p", { class: "muted" }, data.index_available ? "Passages from these sources are retrieved per review. Internal use only: check the reuse terms before showing them outside." : "No search index is available, so reviews run without passages."),

// The knowledge index in three columns: sources, a page of passages, and the passage being read.
const KB_PAGE = 20;
const kb = { source: null, q: "", mode: "all", authority: "", offset: 0, selected: null, info: null };

async function renderKnowledgePage() {
  if (!kb.info) {
    const [settings, knowledge] = await Promise.all([api("/settings"), api("/knowledge")]);
    kb.info = { index: settings.retrieval.index, available: settings.retrieval.available, sources: Object.fromEntries(knowledge.sources.map((item) => [item.id, item])), cards: knowledge.cards };
  }

      table(["Reference", "Authority", "Text"], cards.map((card) => [sourceLink(card.reference, card.url), card.jurisdiction, card.text]))));
    return;
  }
  const total = Object.values(index).reduce((sum, count) => sum + count, 0);
  const title = (id) => (id === "CARDS" ? "Knowledge cards (unverified)" : (sources[id] && sources[id].title) || id);

  const mode = el("select", { "aria-label": "What to show" },
    el("option", { value: "all", selected: kb.mode === "all" }, "All matches"),
    el("option", { value: "ai", selected: kb.mode === "ai" }, "What the AI would receive"));
  const authority = el("select", { "aria-label": "Authority", hidden: kb.mode !== "ai" },

  query.addEventListener("keydown", (event) => { if (event.key === "Enter") go(); });
  mode.addEventListener("change", go);
  authority.addEventListener("change", go);

  let items, footer;
  if (kb.mode === "ai" && kb.q.trim()) {
    const result = await api(`/knowledge/search?${new URLSearchParams({ q: kb.q, ...(kb.authority ? { authority: kb.authority } : {}) })}`);
    items = result.passages.filter((item) => !kb.source || item.source === kb.source);
    footer = el("p", { class: "muted" }, `${items.length} passages pass the relevance thresholds and the limits set on the Settings page. Search terms: ${result.terms.join(", ") || "none"}.`);
  } else {
    const params = new URLSearchParams({ offset: kb.offset, limit: KB_PAGE, ...(kb.source ? { source: kb.source } : {}), ...(kb.q.trim() ? { q: kb.q } : {}) });
    const result = await api(`/knowledge/passages?${params}`);
    items = result.items;
    const page = (offset) => () => { kb.offset = offset; kb.selected = null; renderKnowledgePage(); };
    footer = el("div", { class: "kb-pager" },

async function route() {
  const [page, id, tab] = location.hash.replace(/^#\/?/, "").split("/");
  stopPlaying();
  const pages = { rules: renderRulesPage, sources: renderSourcesPage, knowledge: renderKnowledgePage, settings: renderSettingsPage };
  if (pages[page]) {
    state.page = page;
    renderNav();
    await pages[page]();
    return;
  }
  state.page = "cases";
  renderNav();
  const caseId = page === "case" ? id : page || null;
  if (caseId !== state.caseId) {
    state.draft = emptyDraft();
    state.at = null;
    state.caseId = caseId;
    state.view = null;
  }
  state.tab = tab || "overview";
  if (state.view) render();
  else await refresh();
}

function informationPanel(view, readOnly) {
  const { deficiencies, issues } = view.assessment;
  const heading = view.review_round ? `Round ${view.review_round} of at most ${view.max_review_rounds}: open items` : "Open items";
  const panel = el("section", { class: "panel" }, el("h2", {}, heading));

  else {
    panel.append(openSummary(view), el("p", { class: "muted" }, `You act as ${label("role", state.role)}; change this under Acting as, top right.`));
    if (!readOnly) {
      const all = confirmAllButton(view);
      if (all) panel.append(all);
    }
    // A document asked for by several items gets one upload, at the first of them.
    const offered = new Set();
    for (const item of deficiencies) panel.append(deficiencyRow(item, view, readOnly, offered));
    for (const issue of issues) panel.append(issueRow(issue, view, readOnly));

    }
    panel.append(responseForm(view));

  return panel;
}

// Who has to act on an open item, so each row can offer that person's action.
function actorOf(item) {
  if (item.code === "fact_to_confirm") return "reviewer";
  if (item.code === "document_pending") return "round";
  return "applicant";
}

// The document types that would settle an item, if the pack works with documents.
function documentsFor(item, view) {
  const known = (type) => view.document_types.includes(type);
  if (known(item.subject)) return [item.subject];
  if (item.code === "ai_question") return item.document && known(item.document) ? [item.document] : [];
  return (item.documents || []).filter(known);
}

function openSummary(view) {
  const { deficiencies, issues } = view.assessment;
  const count = (items, test) => items.filter(test).length;
  const plural = (number, word) => `${number} ${word}${number === 1 ? "" : "s"}`;
  const applicant = deficiencies.filter((item) => actorOf(item) === "applicant");
  const uploads = count(applicant, (item) => documentsFor(item, view).length > 0 && item.subject !== "design_model");
  const parts = [];
  if (applicant.length) {
    const answers = applicant.length - uploads;
    parts.push(`For the applicant: ${[uploads && `${uploads} to prove with a document`, answers && `${answers} to answer or deliver otherwise`].filter(Boolean).join(", ")}.`);
  }
  const confirmations = count(deficiencies, (item) => actorOf(item) === "reviewer");
  if (confirmations || issues.length) {
    parts.push(`For ${confirmers()}: ${[confirmations && `${plural(confirmations, "answer")} to confirm`, issues.length && `${plural(issues.length, "escalation")} to resolve`].filter(Boolean).join(", ")}.`);
  }
  const pending = count(deficiencies, (item) => actorOf(item) === "round");
  if (pending) parts.push(`${plural(pending, "document")} assessed when this round is submitted.`);
  return el("p", { class: "muted" }, parts.join(" "));
}

const unreviewed = (view, type) => view.evidence.some((item) => item.type === type && item.document
  && !view.document_verdicts.some((verdict) => verdict.evidence_id === item.evidence_id && verdict.version === item.version));

// One sentence that says what is wrong, in place of the internal code.
function itemHeadline(item) {
  const name = subject(item.subject);
  const sentences = {
    missing: `${name} is missing`,
    document_incomplete: `${name} is not complete`,
    document_pending: `${name} has not been assessed yet`,
    outdated: `${name} has expired`,
    insufficient: `${name} cannot be used`,
    stale_revision: `${name} belongs to an older design revision`,
    revision_unknown: `${name} does not state its design revision`,
  };
  return sentences[item.code] || item.question || name;
}

function itemStatus(item) {
  if (item.code === "fact_to_confirm") return mayConfirm() ? badge("Check this answer", "info") : badge(`Waiting for ${confirmers()}`, "info");
  if (item.code === "document_pending") return badge("Submit the round", "info");
  if (item.code === "ai_question") return badge("Question from the AI", "ai");
  if (item.code === "document_incomplete") return badge("Not complete", "bad");
  if (item.code === "missing") return badge("Missing", "bad");
  if (item.code === "inconsistent_fact") return badge("Contradictory", "bad");
  return badge(label("deficiency", item.code), "warn");
}

// Document text reads as data when it is an internal field name, as in older sample documents.
const plainQuote = (quote) => (quote && !/^[a-z_]+\s*:\s*\S+$/i.test(quote.trim()) ? quote : null);

// What is behind an item: why it is needed, what was found and where.
function itemDetails(item, view, readOnly) {
  const lines = [];
  const types = documentsFor(item, view);
  if (item.domain) lines.push(el("p", {}, `Needed for: ${label("domain", item.domain)}.`));
  if (item.code === "unknown_fact") lines.push(el("p", {}, "The rules need this answer to decide which requirements apply.", types.length ? ` It can be proven with: ${types.map(subject).join(" or ")}.` : ""));
  if (item.code === "missing") lines.push(el("p", {}, "A rule that applies to this modification requires this document."));
  if (["ai_question", "inconsistent_fact"].includes(item.code)) lines.push(el("p", {}, item.detail));
  if (item.code === "document_pending") lines.push(el("p", {}, "It was uploaded and is checked against its checklist when you submit the round."));
  if (item.code === "document_incomplete") {
    const verdict = view.document_verdicts.find((entry) => entry.type === item.subject);
    if (verdict && verdict.missing.length) lines.push(el("p", {}, "Missing from the document:"), el("ul", {}, verdict.missing.map((entry) => el("li", {}, entry))));
    if (verdict && verdict.problems.length) lines.push(el("p", {}, "Problems found:"), el("ul", {}, verdict.problems.map((entry) => el("li", {}, entry))));
    if (!verdict) lines.push(el("p", {}, item.detail));
  }
  if (item.code === "fact_to_confirm") {
    const quote = plainQuote(item.reading.quote);
    if (quote) lines.push(el("p", {}, "Text in the document: ", el("q", {}, quote)));
    lines.push(el("p", {}, `The AI read this answer from the ${subject(item.reading.document)}. It only counts once ${confirmers()} confirms it; declining it keeps the question open.`));
    if (!readOnly && !mayConfirm() && view.document_types.includes(item.reading.document)) {
      lines.push(el("p", {}, `If the answer is wrong, upload a corrected ${subject(item.reading.document)}:`), documentUpload([item.reading.document], view));
    }
  }
  const evidence = item.code === "fact_to_confirm" ? item.reading.evidence_id : (view.evidence.find((entry) => entry.type === item.subject && entry.document) || {}).evidence_id;
  const link = evidence && documentLink(view, evidence, "Open the document");
  if (link) lines.push(el("p", {}, link));
  return lines.length ? el("details", {}, el("summary", {}, "Details"), lines) : null;
}

function deficiencyRow(item, view, readOnly, offered = new Set()) {
  const row = el("div", { class: "request" }, el("div", {}, el("strong", {}, itemHeadline(item)), " ", itemStatus(item)));
  if (item.code === "fact_to_confirm") {
    row.append(el("p", {}, `The ${subject(item.reading.document)} says: `, el("strong", {}, answerText(item, item.reading.value))));
  }
  const details = itemDetails(item, view, readOnly);
  if (details) row.append(details);
  if (readOnly) return row;

  // The action stays visible under the details: an upload, an answer, or a decision.
  const types = documentsFor(item, view);
  if (item.code === "fact_to_confirm") {
    if (mayConfirm()) {
      const decide = (accepted) => (event) => run(event.currentTarget, "Working…", async () => {
        await api(`/cases/${view.case_id}/fact-decisions`, "POST", { name: item.subject, accepted, actor_id: "demo-user", role: state.role });
        toast(accepted ? "Answer confirmed." : "Answer declined.", true);
        await refresh();
      });
      row.append(el("div", { class: "answer" },
        el("button", { class: "primary", onclick: decide(true) }, `Confirm "${answerText(item, item.reading.value)}"`),
        el("button", { onclick: decide(false) }, "Decline")));
    } else {
      row.append(el("p", { class: "muted" }, "Nothing for you to do here."));
    }
  } else if (mayConfirm() || state.role === "observer") {
    // The reviewer and the observer do not deliver information; the applicant does.
    row.append(el("p", { class: "muted" }, item.code === "document_pending"
      ? "Waiting for the applicant to submit the round."
      : `Waiting for the applicant${types.length ? ` to upload the ${types.map(subject).join(" or ")}` : ""}.`));
  } else if (item.subject === "design_model") {
    row.append(el("p", {}, "Upload the proposed IFC model on the BIM model tab."));
  } else if (item.code === "document_pending") {
    row.append(el("p", { class: "muted" }, "Nothing to do yet: press Submit at the bottom to have it assessed."));
  } else if (types.length) {
    if (types.every((type) => offered.has(type))) {
      row.append(el("p", { class: "muted" }, `Upload the ${subject(types[0])} above; it answers this as well.`));
    } else {
      types.forEach((type) => offered.add(type));
      const verb = item.code === "document_incomplete" ? "Upload a corrected version" : `Upload the ${types.map(subject).join(" or ")}`;
      row.append(el("p", {}, `${verb}:`), documentUpload(types, view));
    }
    if (item.code === "ai_question") row.append(answerInput(item));
  } else if (item.code === "ai_question") {
    row.append(answerInput(item));
  } else if (item.code === "unknown_fact" || item.code === "inconsistent_fact") {
    row.append(factInput(item));
  } else {
    row.append(documentInput(item));
  }
  return row;
}

// A fact value as the answer to its question, for example Yes or No instead of true or false.
function answerText(item, value) {
  const choice = factChoices(item).find(([option]) => option === value);
  return choice ? choice[1] : String(value);
}

const mayConfirm = () => (state.meta.resolution_roles || []).includes(state.role);
const confirmers = () => (state.meta.resolution_roles || []).map((role) => label("role", role)).join(" or ");

// A link to the original file of an uploaded document, or a note when it was not kept.
function documentLink(view, evidenceId, text) {
  const item = view.evidence.find((entry) => entry.evidence_id === evidenceId);
  if (!item || !item.document) return null;
  if (!item.file_kept) return el("span", { class: "muted" }, "Original file not kept (uploaded before files were stored)");
  return el("a", { href: `/cases/${view.case_id}/documents/${encodeURIComponent(evidenceId)}/file?version=${item.version}`, target: "_blank", rel: "noopener" },
    text || `Open ${subject(item.type)} (version ${item.version})`);
}


// Confirms every fact read from documents at once, one decision per fact as if confirmed one by one.
function confirmAllButton(view) {
  const items = view.assessment.deficiencies.filter((item) => item.code === "fact_to_confirm");
  if (items.length < 2 || !mayConfirm()) return null;
  return el("p", {}, el("button", {
    class: "primary",
    onclick: (event) => run(event.currentTarget, "Confirming…", async () => {
      for (const item of items) {
        await api(`/cases/${view.case_id}/fact-decisions`, "POST", { name: item.subject, accepted: true, actor_id: "demo-user", role: state.role });
      }
      toast(`${items.length} facts confirmed.`, true);
      await refresh();
    }),
  }, `Confirm all ${items.length} answers read from documents`), " ", el("span", { class: "muted" }, "Each is recorded as a separate confirmation."));
}

// An upload for one of the given document types; with several, the applicant picks which one it is.
function documentUpload(types, view) {
  const choice = types.length > 1
    ? el("select", { "aria-label": "Document type" }, types.map((type) => el("option", { value: type }, subject(type))))
    : null;
  const type = () => (choice ? choice.value : types[0]);
  const input = el("input", { type: "file", accept: ".pdf", "aria-label": `File for ${types.map(subject).join(" or ")}` });
  const row = el("div", { class: "answer" }, choice, input, el("button", {
    class: "primary",
    onclick: (event) => {
      if (!input.files.length) return;
      run(event.currentTarget, "Reading…", () => uploadDocument(view, type(), input.files[0].name, input.files[0]));
    },
  }, types.length > 1 ? "Upload" : `Upload ${subject(types[0])}`));
  const sample = (incomplete) => (event) => run(event.currentTarget, "Reading…", async () => {
    const blob = await (await fetch(`/demo/documents/${view.scenario}/${type()}?incomplete=${incomplete}`)).blob();
    await uploadDocument(view, type(), `${type()}.pdf`, blob);
  });
  if (view.scenario) row.append(el("button", { onclick: sample(false) }, "Use sample"), el("button", { onclick: sample(true) }, "Use incomplete sample"));
  const waiting = types.filter((item) => unreviewed(view, item));
  return el("div", {}, waiting.length > 0 && badge(`${waiting.map(subject).join(", ")} uploaded, assessed when the round is submitted`, "info"), row);
}

async function uploadDocument(view, type, filename, content) {
  const params = new URLSearchParams({ type, filename });
  const response = await fetch(`/cases/${view.case_id}/documents?${params}`, { method: "POST", body: content });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(errorMessage(response.status, data.detail));
  toast("Document stored. It is assessed when you submit this round.", true);
  await refresh();
}

function documentPanel(view, readOnly) {
  const verdicts = Object.fromEntries(view.document_verdicts.map((verdict) => [verdict.evidence_id, verdict]));
  const documents = view.evidence.filter((item) => item.document && view.document_specs[item.type]);
  return el("section", { class: "panel" }, el("h2", {}, "Document assessment"),
    el("p", { class: "muted" }, "Claude reports per checklist item and the application decides whether a document is complete. A reviewer can assess a document instead, for example once the AI has stopped."),
    documents.map((item) => {
      const verdict = verdicts[item.evidence_id];
      const current = verdict && verdict.version === item.version ? verdict : null;
      const byReviewer = current && current.assessed_by === "reviewer";
      return el("div", { class: "request" },
        el("div", { style: "float:right" }, documentLink(view, item.evidence_id, "Open")),
        el("strong", {}, subject(item.type)), " ",
        current ? badge(current.status === "complete" ? "Complete" : "Incomplete", current.status === "complete" ? "ok" : "bad") : badge("Not yet assessed", "warn"),
        ` version ${item.version} `,
        current ? badge(byReviewer ? `Assessed by ${label("role", current.role)}` : "Assessed by the AI", byReviewer ? "info" : "ai") : null,
        current && current.problems.length > 0 && el("p", { class: "muted" }, current.problems.join(" ")),
        current && el("ul", {}, current.checklist.map((entry) => el("li", {}, `${entry.present ? "Present" : "Missing"}: ${entry.item}${entry.location ? ` (${entry.location})` : ""}`))),
        current && current.facts.length > 0 && el("p", {}, "Facts it proves: ", current.facts.map((fact) => `${subject(fact.name)}: ${fact.value}`).join("; ")),
        !readOnly && el("p", {}, el("button", { onclick: () => documentDialog(item, view) }, byReviewer ? "Assess again as reviewer" : "Assess as reviewer")));
    }));
}

function documentDialog(item, view) {
  const spec = view.document_specs[item.type];
  const boxes = spec.must_contain.map((entry) => [entry, el("input", { type: "checkbox" })]);
  const open = Object.fromEntries((view.assessment ? view.assessment.deficiencies : []).map((deficiency) => [deficiency.subject, deficiency]));
  const facts = spec.proves.map((name) => {
    const choices = factChoices(open[name] || { subject: name });
    const title = (open[name] && open[name].question) || subject(name);
    return [name, choices, el("select", { "aria-label": title }, el("option", { value: "" }, "Not stated"), choices.map(([, text], index) => el("option", { value: String(index) }, text))), title];
  });
  // Facts the case is waiting for come first; the others this document could prove are folded away.
  const field = ([, , select, title]) => el("label", {}, title, select);
  const asked = facts.filter(([name]) => open[name]);
  const other = facts.filter(([name]) => !open[name]);
  const note = el("textarea", { rows: 2, placeholder: "What you checked, or what is wrong" });
  const dialog = $("dialog");
  dialog.replaceChildren(el("form", { method: "dialog" },
    el("h2", {}, `Assess ${subject(item.type)}`),
    el("p", { class: "muted" }, `You are acting as ${label("role", state.role)}. Only ${(state.meta.resolution_roles || []).map((role) => label("role", role)).join(" or ")} may assess documents. No AI call is made.`),
    el("h3", {}, "What the document contains"),
    boxes.map(([entry, box]) => el("label", { class: "check" }, box, ` ${entry}`)),
    facts.length > 0 && el("h3", {}, "What it proves"),
    facts.length > 0 && el("p", { class: "muted" }, "Only when every item above is present. A fact you record counts as confirmed."),
    asked.map(field),
    other.length > 0 && el("details", {}, el("summary", {}, `${asked.length ? "Other facts" : "Facts"} this document can prove (${other.length})`), other.map(field)),
    el("label", {}, "Note", note),
    el("div", { class: "row" },
      el("button", { value: "cancel" }, "Cancel"),
      el("button", {
        class: "primary",
        onclick: (event) => {
          event.preventDefault();
          run(event.currentTarget, "Working…", async () => {
            const stated = Object.fromEntries(facts.filter(([, , select]) => select.value !== "").map(([name, choices, select]) => [name, choices[Number(select.value)][0]]));
            const present = boxes.filter(([, box]) => box.checked).map(([entry]) => entry);
            dialog.close();
            await api(`/cases/${view.case_id}/document-decisions`, "POST", {
              evidence_id: item.evidence_id, present, facts: stated, note: note.value, actor_id: "demo-user", role: state.role,
            });
            toast("Document assessed.", true);
            await refresh();
          });
        },
      }, "Save assessment"))));
  dialog.showModal();
}

function factChoices(item) {
  if (item.options && item.options.length) return item.options.map((option) => [option.value, option.label]);
  if (item.subject === "occupancy") return OCCUPANCY;
  return [[true, "Yes"], [false, "No"]];
}

function factInput(item) {
  const choices = factChoices(item);
  const current = choices.findIndex(([value]) => value === state.draft.facts[item.subject]);
  const select = el("select", {
    "aria-label": item.question || subject(item.subject),
    onchange: (event) => {
      if (event.target.value === "") delete state.draft.facts[item.subject];
      else state.draft.facts[item.subject] = choices[Number(event.target.value)][0];
    },
  }, el("option", { value: "" }, "Choose an answer"), choices.map(([, text], index) => el("option", { value: String(index), selected: index === current }, text)));
  return el("div", { class: "answer" }, select);
}

function answerInput(item) {
  const input = el("textarea", { rows: 2, "aria-label": item.question, placeholder: "Your answer", oninput: (event) => { state.draft.answers[item.question] = event.target.value; } });
  input.value = state.draft.answers[item.question] || "";
  return input;
}

function documentInput(item) {
  const box = el("input", { type: "checkbox", style: "width:auto", onchange: (event) => { state.draft.documents[item.subject] = event.target.checked; } });
  box.checked = Boolean(state.draft.documents[item.subject]);
  return el("label", { class: "answer" }, box, "Add document (simulated)");
}

function responseForm(view) {
  const note = el("textarea", { rows: 2, placeholder: "Optional context. This explains, but it does not prove anything.", oninput: (event) => { state.draft.note = event.target.value; } });
  note.value = state.draft.note;
  const reviewed = Boolean(view.assessment.llm_review);
  return el("div", {}, note, el("div", { class: "answer" }, el("button", {
    class: "primary",
    onclick: (event) => run(event.currentTarget, reviewed ? "Claude is reviewing…" : "Working…", async () => {
      const { facts, answers, documents, note: text } = state.draft;
      await api(`/cases/${view.case_id}/responses`, "POST", {
        facts,
        answers: Object.entries(answers).map(([question, answer]) => ({ question, answer })),
        documents: Object.keys(documents).filter((key) => documents[key]),
        note: text,
      });
      state.draft = emptyDraft();
      toast(reviewed ? "Round submitted. Rules and Claude have assessed the case again." : "Information added and reassessed by the rules.", true);
      await refresh();
    }),
  }, reviewed ? "Submit and start next round" : "Submit")),
    reviewed && el("p", { class: "muted" }, "Everything you filled in goes together into one new assessment. This takes up to a minute."));
}

async function uploadModel(view, kind, filename, content) {
  const params = new URLSearchParams({ kind, filename });
  const response = await fetch(`/cases/${view.case_id}/models?${params}`, { method: "POST", body: content });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(errorMessage(response.status, data.detail));
  toast("Model read and the case reassessed.", true);
  await refresh();
}

function modelRow(item) {
  const model = item.model;
  const counts = Object.entries(model.elements).map(([name, count]) => `${count} ${name.replace("Ifc", "")}`).join(", ");
  return el("div", { class: "request" },
    el("strong", {}, subject(item.type)), " ", badge(`${model.schema}, version ${item.version}`, "info"),
    el("div", { class: "muted" }, `${model.filename}: ${counts}`),
    item.type === "design_model" && el("p", {}, model.compared ? `${item.changes.length} changed elements compared with the baseline.` : "No baseline, so nothing was compared."),
    item.changes && item.changes.length > 0 && el("ul", {}, item.changes.map((change) => el("li", {},
      `${change.change}: ${change.name} (${change.class.replace("Ifc", "")})${Object.keys(change.properties).length ? `, ${Object.entries(change.properties).map(([key, value]) => `${key} ${value}`).join(", ")}` : ""}`))),
    Object.keys(item.facts).length > 0 && el("p", { class: "muted" }, `Established from the model: ${Object.entries(item.facts).map(([key, value]) => `${key} = ${value}`).join(", ")}`));
}

function fileButton(view, kind, text) {
  const input = el("input", { type: "file", accept: ".ifc", "aria-label": text });
  return el("div", { class: "answer" }, input, el("button", {
    onclick: (event) => {
      if (!input.files.length) return;
      run(event.currentTarget, "Reading…", () => uploadModel(view, kind, input.files[0].name, input.files[0]));
    },
  }, text));
}

function bimPanel(view, readOnly) {
  const models = view.evidence.filter((item) => item.model);
  const hasBaseline = models.some((item) => item.type === "baseline_model");
  const panel = el("section", { class: "panel" }, el("h2", {}, "BIM model"),
    el("p", { class: "muted" }, "This permit must be delivered as a real IFC file. The app reads it, compares it with the approved baseline and uses the result in the assessment."),
    models.map(modelRow));
  if (readOnly) return panel;
  if (view.scenario && !models.some((item) => item.type === "design_model")) {
    panel.append(el("p", {}, el("button", {
      class: "primary",
      onclick: (event) => run(event.currentTarget, "Reading…", async () => {
        const sample = await (await fetch(`/demo/models/${view.scenario}/proposed`)).blob();
        await uploadModel(view, "proposed", `${view.scenario}-proposed.ifc`, sample);
      }),
    }, "Use the sample proposed model")));
  }
  if (!hasBaseline) panel.append(fileButton(view, "baseline", "Upload baseline model"));
  panel.append(fileButton(view, "proposed", "Upload proposed model"));
  if (view.scenario) panel.append(el("p", { class: "muted" }, el("a", { href: `/demo/models/${view.scenario}/proposed` }, "Download the sample model")));

}

function issueRow(issue, view, readOnly) {
  return el("div", { class: "issue" },
    el("strong", {}, label("issue", issue.kind)),
    el("p", {}, issue.detail),
    issue.rules.length ? el("p", { class: "muted" }, `Rules: ${issue.rules.join(", ")}`) : null,
    !readOnly && (mayConfirm()
      ? el("button", { onclick: () => resolveDialog(issue, view) }, "Resolve")

function resolveDialog(issue, view) {

function aiPanel(view, readOnly) {
  const review = view.assessment.llm_review;
  const panel = el("section", { class: "panel ai" }, el("h2", {}, el("span", { class: "ai-label" }, "AI review")));
  if (!review) {
    panel.append(el("p", { class: "muted" }, view.modification && !view.modification.change_type ? "Claude reviews the case once the IFC model is delivered." : "This test case runs without AI, on the rules only."));
  } else if (review.status === "unavailable") {
    panel.append(el("p", {}, `No AI review obtained: ${review.reason}`));
  } else {
    panel.append(
      el("p", {}, review.summary),
      el("p", {}, badge(`Type: ${review.change_type}`, "ai"), " ", badge(`Confidence: ${review.confidence}`, "ai"), " ", badge(`Materiality: ${review.materiality}`, "ai")));
    if (review.proposed_facts.length) {
      panel.append(el("h3", {}, "Proposed facts"), el("p", { class: "muted" }, "These are suggestions. They only count once confirmed."));
      for (const fact of review.proposed_facts) {
        panel.append(el("div", { class: "request" }, el("strong", {}, `${fact.name}: ${fact.value}`), el("div", { class: "muted" }, fact.basis)));
      }
    }
    if (review.sources && review.sources.length) {
      const claims = Object.fromEntries((review.citations || []).map((item) => [item.passage_id, item.claim]));
      panel.append(el("h3", {}, "Sources consulted"), el("p", { class: "muted" }, "Retrieved for this round. They advise only; a source Claude relied on shows its claim."));
      for (const source of review.sources) {
        panel.append(el("div", { class: "request" },
          el("strong", {}, source.url ? el("a", { href: source.url, target: "_blank", rel: "noopener" }, source.reference) : source.reference),
          " ", badge(source.source === "CARDS" ? "Unverified card" : "Unverified extract", "warn"), claims[source.id] ? " " : null, claims[source.id] ? badge("Cited", "ai") : null,
          el("div", { class: "muted" }, source.title),
          el("div", { class: "muted" }, claims[source.id] || `${source.excerpt}…`)));
      }
    }
    if (review.uncertainties.length) {
      panel.append(el("details", {}, el("summary", {}, `Uncertainties (${review.uncertainties.length})`),
        el("ul", {}, review.uncertainties.map((item) => el("li", {}, item)))));
    }
    panel.append(el("p", { class: "muted" }, `Advice from ${review.model}. Rules and evidence decide.`));
  }
  if (view.ai_stop) panel.append(el("p", {}, badge("No further AI review", "bad"), ` ${label("aiStop", view.ai_stop)}. A reviewer takes over.`));
  if (state.meta.llm_enabled && state.meta.ai) {
    const { review: reviewer, documents } = state.meta.ai;
    const name = (task) => `${task.model}${task.effort ? ` (effort ${task.effort})` : ""}`;
    panel.append(el("p", { class: "muted" }, `Models: review ${name(reviewer)}, documents ${documents ? name(documents) : "read within the review"}.`));
  }
  if (state.meta.llm_enabled) {
    panel.append(el("p", { class: "muted" }, `AI cost of this case: $${(view.llm_cost_usd || 0).toFixed(2)}${view.case_budget_usd != null ? ` of a $${view.case_budget_usd.toFixed(2)} budget` : ""}. Round ${view.review_round} of at most ${view.max_review_rounds}.`));
  }
  if (!readOnly && state.meta.llm_enabled && review && !view.ai_stop && view.review_round < view.max_review_rounds) {
    panel.append(el("p", {}, el("button", {
      class: "ai",
      onclick: (event) => run(event.currentTarget, "Claude is reviewing…", async () => {
        await api(`/cases/${view.case_id}/llm-review`, "POST");
        toast("Claude has reviewed again.", true);
        await refresh();
      }),
    }, "Ask Claude to review again")));
  }
  return panel;
}

function domainPanel(view) {
  const { domains, llm_review: review, applied_rules: rules } = view.assessment;
  const findings = Object.fromEntries(((review && review.domains) || []).map((item) => [item.domain, item]));
  const names = [...new Set([...Object.keys(domains), ...Object.keys(findings)])];
  return el("section", { class: "panel" },
    el("h2", {}, "Rules and AI side by side"),
    el("div", { style: "overflow-x:auto" }, el("table", {},
      el("thead", {}, el("tr", {}, ["Domain", "Rules (decisive)", "AI (advisory)", "Applied rules", "AI rationale"].map((text) => el("th", {}, text)))),
      el("tbody", {}, names.map((name) => {
        const status = domains[name] || "not_affected";
        const finding = findings[name];
        return el("tr", {},
          el("td", {}, label("domain", name)),
          el("td", {}, badge(label("domainStatus", status), LABELS.domainClass[status])),
          el("td", {}, finding ? badge(label("domainStatus", finding.status), "ai") : "–"),
          el("td", {}, rules.filter((rule) => rule.domain === name).map((rule) => el("div", { title: rule.source_title || "" },
            `${rule.title || rule.rule}${rule.reference ? `, ${rule.reference}` : ""} (${rule.source_kind})`))),
          el("td", { class: "muted" }, finding ? finding.rationale : ""));
      })))));
}

function describeEvent(event) {
  const payload = event.payload;
  switch (event.type) {
    case "case_opened":
      return { title: "Case opened", text: `Design revision ${payload.revision}` };
    case "modification_submitted":
      return { title: "Modification submitted", tag: "H0.1", text: payload.description };
    case "llm_review_recorded":
      return payload.status === "completed"
        ? { title: `AI review, round ${payload.round}`, tag: "AI", cls: "ai", text: `${payload.summary} ${payload.information_requests.length} questions, ${(payload.sources || []).length} sources, ${(payload.citations || []).length} cited, ${(payload.document_verdicts || []).length} documents assessed.` }
        : { title: "AI review unavailable", tag: "AI", cls: "bad", text: payload.reason };
    case "llm_documents_read":
      return payload.status === "completed"
        ? { title: "AI document check", tag: "AI", cls: "ai", text: payload.document_verdicts.map((item) => `${subject(item.type)}: ${item.status}`).join(", ") || "No documents reported." }
        : { title: "AI document check unavailable", tag: "AI", cls: "bad", text: `${payload.reason}. The review reads the documents instead.` };
    case "document_assessed":
      return { title: `Document assessed by ${label("role", payload.role)}`, cls: payload.status === "complete" ? "ok" : "bad", text: `${subject(payload.type)}: ${payload.status}${payload.facts.length ? `, proves ${payload.facts.map((fact) => subject(fact.name)).join(", ")}` : ""}` };
    case "llm_review_skipped":
      return { title: "AI review not made", tag: "Cost limit", cls: "bad", text: `No call to the AI: ${label("aiStop", payload.reason)}.` };
    case "assessment_recorded":
      return { title: "Rules and evidence checked", tag: "H0.2–H0.5", text: `${payload.deficiencies.length} open items, ${payload.issues.length} escalations${payload.withdrawn_flags.length ? `, ${payload.withdrawn_flags.length} AI flags withdrawn` : ""}` };
    case "plan_recorded":
      return { title: "Next step determined", tag: "H0.6–H0.7", text: payload.next_action ? `${label("action", payload.next_action)}${payload.held ? " (on hold)" : ""}` : "No further action" };
    case "evidence_registered":
      return { title: "Information added", cls: "ok", text: payload.description || `${subject(payload.type)}, version ${payload.version}` };
    case "action_executed":
      return { title: `Action performed: ${label("action", payload.action)}`, tag: "H0.8", cls: "ok", text: `By ${payload.actor_id === "repermit" ? "the system" : label("role", payload.role)}` };
    case "action_denied":
      return { title: `Action refused: ${label("action", payload.action)}`, tag: "E4", cls: "bad", text: `${label("role", payload.role)}: ${label("reason", payload.reason)}` };
    case "stage_reversed":
      return { title: "Case moved back after new information", tag: "E5", cls: "bad", text: `Back to ${label("stage", payload.to_stage)}` };
    case "issue_resolved":
      return { title: "Escalation resolved", cls: "ok", text: `${payload.decision} (${payload.source})` };
    case "fact_declined":
      return { title: "Fact declined by the reviewer", cls: "bad", text: payload.name };
    case "resolution_denied":
      return { title: "Resolution refused", cls: "bad", text: label("role", payload.role) };
    default:
      return { title: event.type, text: "" };
  }
}

// Who took the step: the AI only advises, the rules engine decides, and people act under their role.
function decider(event) {
  const payload = event.payload;
  const person = (role) => ({ who: `Person: ${label("role", role)}`, cls: "" });
  switch (event.type) {
    case "case_opened":
      return person(payload.responsible_role);
    case "modification_submitted":
    case "evidence_registered":
      return { who: "Applicant", cls: "" };
    case "llm_review_recorded":
      return { who: "AI (advisory)", cls: "ai", why: "The AI advises. Its findings only count once the rules engine or a reviewer takes them over." };
    case "llm_documents_read":
      return { who: "AI (advisory)", cls: "ai", why: "The AI reports what each document contains. The application decides whether it is complete, and a reviewer confirms the facts." };
    case "assessment_recorded": {
      const usedAi = payload.llm_review || payload.deficiencies.some((item) => item.code === "ai_question") || payload.issues.some((item) => item.kind === "llm_flag");
      return { who: usedAi ? "Rules engine, with AI input" : "Rules engine", cls: "info", why: `Decided by the rules in pack ${payload.pack_version}${usedAi ? ". Items marked AI come from the AI review" : ""}.` };
    }
    case "llm_review_skipped":
      return { who: "System (cost limit)", cls: "info", why: "The application refuses further paid AI calls once a limit is reached, whatever is uploaded." };
    case "plan_recorded":
    case "stage_reversed":
      return { who: "Rules engine", cls: "info", why: `Decided by the process rules in pack ${state.latest ? state.latest.pack_version : "of this case"}.` };
    case "action_denied":
      return { who: "Rules engine", cls: "info", why: "The permission and process rules refused this request." };
    case "action_executed":
      return payload.actor_id === "repermit"
        ? { who: "System (automatic)", cls: "info", why: "The rules allow this action to run without a person." }
        : person(payload.role);
    default:
      return payload.role ? person(payload.role) : null;
  }
}

// The summary is made when the tool runs; the log keeps only the start of the result.
const toolSummary = (call) => call.summary || `${call.result.slice(0, 120)}…`;

// What each step was based on, from its recorded payload. Rows without content are left out.
function stepBasis(event) {
  const payload = event.payload;
  const list = (items) => (items.length ? el("ul", {}, items.map((item) => el("li", {}, item))) : null);
  const facts = (values) => list(Object.entries(values || {}).map(([name, value]) => `${subject(name)}: ${value}`));
  const fromAi = () => [" ", badge("AI", "ai")];
  const rows = [];
  const add = (name, content) => { if (content != null && content !== "" && !(Array.isArray(content) && !content.length)) rows.push([name, content]); };
  const who = decider(event);
  if (who) add("Decided by", who.why ? [who.who, el("div", { class: "muted" }, who.why)] : who.who);
  switch (event.type) {
    case "case_opened":
      add("Rule pack", payload.pack_version);
      add("Permit type", payload.permit_type === "new_permit" ? "New permit" : "Modification");
      add("Responsible role", label("role", payload.responsible_role));
      break;
    case "modification_submitted":
      add("Change type", payload.change_type ? `${payload.change_type} (given by the applicant)` : "Left to the AI to classify");
      add("Facts stated", facts(payload.facts));
      break;
    case "llm_documents_read":
      add("Model", payload.model);
      if (payload.usage) add("Tokens and cost", `${payload.usage.input_tokens.toLocaleString("en")} in, ${payload.usage.output_tokens.toLocaleString("en")} out, $${payload.usage.cost_usd.toFixed(3)} (${payload.usage.model || payload.model})`);
      add("Reason", payload.reason);
      add("Documents", list(payload.document_verdicts.map((item) => `${subject(item.type)}: ${item.status}${item.missing.length ? `, missing: ${item.missing.join("; ")}` : ""}${item.facts.length ? `, facts read: ${item.facts.map((fact) => `${subject(fact.name)} = ${fact.value}`).join(", ")}` : ""}`)));
      break;
    case "document_assessed":
      add("Document", `${subject(payload.type)} (${payload.evidence_id}), version ${payload.version}`);
      add("Actor", payload.actor_id);
      add("Checklist", list(payload.checklist.map((entry) => `${entry.present ? "Present" : "Missing"}: ${entry.item}`)));
      add("Facts confirmed", list(payload.facts.map((fact) => `${subject(fact.name)}: ${fact.value}`)));
      add("Note", payload.note);
      break;
    case "llm_review_skipped":
      add("Reason", label("aiStop", payload.reason));
      add("Rounds", `${payload.round} of at most ${payload.max_review_rounds}`);
      add("AI cost of this case", `$${payload.case_cost_usd.toFixed(2)}${payload.case_budget_usd != null ? ` of $${payload.case_budget_usd.toFixed(2)}` : ""}`);
      add("Daily budget", payload.daily_budget_usd != null ? `$${payload.daily_budget_usd.toFixed(2)}` : null);
      break;
    case "llm_review_recorded":
      if (payload.usage) add("Tokens and cost", `${payload.usage.input_tokens.toLocaleString("en")} in, ${payload.usage.output_tokens.toLocaleString("en")} out${payload.usage.cache_read_tokens ? `, ${payload.usage.cache_read_tokens.toLocaleString("en")} from cache` : ""}, $${payload.usage.cost_usd.toFixed(3)}${payload.usage.turns > 1 ? ` over ${payload.usage.turns} turns` : ""} (${payload.usage.model || payload.model})`);
      if (payload.status !== "completed") { add("Reason", payload.reason); break; }
      add("Looked up in the BIM model", list((payload.tool_calls || []).map((call) => [
        el("code", {}, `${call.name}(${Object.entries(call.input).filter(([, value]) => value !== null && value !== "any").map(([key, value]) => `${key}=${value}`).join(", ")})`),
        call.error ? [" ", badge("error", "bad")] : null,
        el("div", { class: "muted" }, toolSummary(call)),
      ])));
      add("Classification", `${payload.effective_change_type || payload.change_type}, confidence ${payload.confidence}, ${payload.materiality.replace("_", " ")}`);
      add("Domains", list(payload.domains.map((item) => `${label("domain", item.domain)}: ${label("domainStatus", item.status)}. ${item.rationale}`)));
      add("Information requested", list(payload.information_requests.map((item) => `${item.question}${item.document ? ` Document: ${subject(item.document)}.` : ""} Why: ${item.reason}`)));
      add("Proposed facts", list(payload.proposed_facts.map((item) => `${subject(item.name)}: ${item.value}. Basis: ${item.basis}`)));
      add("Documents assessed", list((payload.document_verdicts || []).map((item) => `${subject(item.type)}: ${item.status}${item.missing && item.missing.length ? `, missing: ${item.missing.join("; ")}` : ""}`)));
      add("Uncertainties", list(payload.uncertainties));
      add("Model", payload.model);
      {
        const sources = Object.fromEntries((payload.sources || []).map((item) => [item.id, item]));
        const cited = (payload.citations || []).filter((item) => sources[item.passage_id]);
        add("Sources relied on", list(cited.map((item) => {
          const source = sources[item.passage_id];
          return [sourceLink(source.reference, source.url), " ", badge(source.source === "CARDS" ? "Unverified card" : "Unverified extract", "warn"), el("div", { class: "muted" }, item.claim)];
        })));
        const unused = (payload.sources || []).length - cited.length;
        add("Sources consulted", (payload.sources || []).length ? `${(payload.sources || []).length} ${(payload.sources || []).length === 1 ? "passage" : "passages"} retrieved, ${cited.length} relied on${unused ? `, ${unused} not used` : ""}` : "No passages retrieved");
        if ((payload.invalid_citations || []).length) add("Citations removed", `${payload.invalid_citations.length} citations of passages that were not provided`);
      }
      break;
    case "assessment_recorded":
      add("Rule pack and revision", `${payload.pack_version}, revision ${payload.revision}`);
      add("Domains", list(Object.entries(payload.domains).map(([name, status]) => `${label("domain", name)}: ${label("domainStatus", status)}`)));
      if (payload.llm_review && payload.llm_review.effective_change_type) add("Change type used", [payload.llm_review.effective_change_type, ...fromAi(), el("div", { class: "muted" }, "Classified by the AI because the applicant left it open.")]);
      add("Rules applied", list(payload.applied_rules.map((rule) => [
        `${rule.rule}${rule.title ? ` ${rule.title}` : ""}`,
        el("div", { class: "muted" }, sourceLink(rule.reference || rule.source_title || rule.source, state.ruleUrls[rule.rule]), rule.reference && rule.source_title ? `, ${rule.source_title}` : "", ` (${rule.source_kind})`),
      ])));
      add("Evidence considered", list(Object.entries(payload.basis.evidence).map(([id, version]) => `${id}, version ${version}`)));
      add("Open items", list(payload.deficiencies.map((item) => [`${label("deficiency", item.code)}: ${item.detail || subject(item.subject)}`, ...(item.code === "ai_question" ? fromAi() : [])])));
      add("Escalations", list(payload.issues.map((item) => [`${label("issue", item.kind)}: ${item.detail}${item.rules && item.rules.length ? ` (${item.rules.join(", ")})` : ""}`, ...(item.kind === "llm_flag" ? fromAi() : [])])));
      add("AI flags withdrawn", list(payload.withdrawn_flags));
      if (!payload.deficiencies.length && !payload.issues.length) add("Outcome", "All required information is present and no rule conflicts were found.");
      break;
    case "plan_recorded":
      add("Next action", payload.next_action ? label("action", payload.next_action) : "None: the process is finished");
      add("Roles allowed", (payload.roles || []).map((role) => label("role", role)).join(" or "));
      add("Automation", payload.autonomy ? label("autonomy", payload.autonomy) : null);
      add("On hold because", list(payload.hold_reasons || []));
      break;
    case "evidence_registered":
      add("Item", `${subject(payload.type)} (${payload.category}), version ${payload.version}`);
      add("Domain", label("domain", payload.domain));
      add("Revision", payload.revision || "Unknown");
      add("Status", payload.status);
      add("Valid until", payload.valid_until);
      add("Facts it states", facts(payload.facts));
      break;
    case "action_executed":
      add("Stage", `${label("stage", payload.from_stage)} → ${label("stage", payload.to_stage)}`);
      if (payload.actor_id !== "repermit") add("Actor", payload.actor_id);
      add("Based on assessment", payload.basis_fingerprint ? `fingerprint ${payload.basis_fingerprint.slice(0, 12)}…` : null);
      break;
    case "action_denied":
      add("Requested by", `${payload.actor_id} as ${label("role", payload.role)}`);
      add("Refused because", label("reason", payload.reason));
      break;
    case "stage_reversed":
      add("Stage", `${label("stage", payload.from_stage)} → ${label("stage", payload.to_stage)}`);
      add("Reason", payload.reason);
      break;
    case "issue_resolved":
    case "resolution_denied":
      add("Escalation", payload.issue_id);
      add("Actor", payload.actor_id);
      add("Decision", payload.decision);
      add("Source", payload.source);
      add("Rule chosen", payload.selected_rule_id);
      break;
    case "fact_declined":
      add("Fact", subject(payload.name));
      add("From document", payload.evidence_id);
      add("Declined by", `${payload.actor_id} as ${label("role", payload.role)}`);
      break;
  }
  if (!rows.length) return null;
  return el("details", {}, el("summary", { class: "muted" }, "Basis for this step"),
    el("dl", { class: "basis" }, rows.flatMap(([name, content]) => [el("dt", {}, name), el("dd", {}, content)])));
}

function flowPanel() {
  const total = state.history.length;
  const current = state.at || total;
  return el("section", { class: "panel" },
    el("div", { class: "case-head" }, el("h2", {}, "Flow of this case"),
      el("div", { class: "controls" },
        el("button", { disabled: current <= 1, onclick: () => { stopPlaying(); showStep(current - 1); } }, "Previous"),
        el("span", { class: "muted" }, `Step ${current} of ${total}`),
        el("button", { disabled: current >= total, onclick: () => { stopPlaying(); showStep(current + 1); } }, "Next"),
        el("button", { onclick: togglePlay }, state.timer ? "Pause" : "Play"),
        el("button", { disabled: !state.at, onclick: () => { stopPlaying(); showStep(total); } }, "Go to now"))),
    el("ol", { class: "timeline" }, state.history.map((event) => {
      const info = describeEvent(event);
      const who = decider(event);
      const position = event.seq > current ? "future" : event.seq === current ? "current" : "";
      return el("li", { class: `${position} ${info.cls || ""}` }, el("button", { onclick: () => { stopPlaying(); showStep(event.seq); } },
        el("div", {}, el("span", { class: "step-title" }, `${event.seq}. ${info.title}`), " ", info.tag ? badge(info.tag, info.cls === "ai" ? "ai" : "") : null,
          who ? [" ", badge(who.who, who.cls)] : null),
        info.text ? el("div", { class: "muted" }, info.text) : null),
        stepBasis(event));
    })));
}

function evidencePanel(view) {
  const impact = Object.fromEntries(((view.assessment && view.assessment.impact) || []).map((item) => [item.evidence_id, item.impact]));
  return el("section", { class: "panel" }, el("h2", {}, "Case file"),
    el("div", { style: "overflow-x:auto" }, el("table", {},
      el("thead", {}, el("tr", {}, ["Item", "Domain", "Revision", "Version", "Content", "Effect"].map((text) => el("th", {}, text)))),
      el("tbody", {}, view.evidence.map((item) => el("tr", {},
        el("td", {}, subject(item.type)),
        el("td", {}, label("domain", item.domain)),
        el("td", {}, item.revision || "Unknown"),
        el("td", {}, String(item.version)),
        el("td", { class: "muted" }, item.description || Object.entries(item.facts).map(([key, value]) => `${key}: ${value}`).join(", ") || (item.format ? item.format.toUpperCase() : "")),
        el("td", {}, impact[item.evidence_id] ? badge(label("impact", impact[item.evidence_id])) : "–")))))));
}

function ownDialog() {
  const project = el("input", { value: "Own request" });
  const description = el("textarea", { rows: 4, placeholder: "Describe the design modification in your own words." });
  const dialog = $("dialog");
  dialog.replaceChildren(el("form", { method: "dialog" },
    el("h2", {}, "Submit your own request"),
    el("p", { class: "muted" }, "Claude classifies and reviews your text. It is sent to the Anthropic API and takes up to a minute."),
    el("label", {}, "Project", project),
    el("label", {}, "Modification", description),
    el("div", { class: "row" },
      el("button", { value: "cancel" }, "Cancel"),
      el("button", {
        class: "primary",
        onclick: (event) => {
          event.preventDefault();
          if (!description.value.trim()) return;
          run(event.currentTarget, "Claude is reviewing…", async () => {
            const created = await api("/cases", "POST", { project_name: `[SYNTHETIC] ${project.value}`, revision: "A", responsible_role: "consultant" });
            await api(`/cases/${created.case_id}/modifications`, "POST", { revision: "B", description: description.value.trim() });
            dialog.close();
            await openCase(created.case_id);
          });
        },
      }, "Submit"))));
  dialog.showModal();
}

async function start() {
  state.meta = await api("/meta");
  // Rule id to source URL, so the flow can link each applied rule to its article.
  state.ruleUrls = Object.fromEntries((await api("/knowledge")).rules.map((rule) => [rule.id, rule.source_url]));
  $("role").replaceChildren(...state.meta.roles.map((role) => el("option", { value: role }, label("role", role))));
  $("role").addEventListener("change", (event) => { state.role = event.target.value; if (state.view && state.page === "cases") render(); });
  $("own").addEventListener("click", ownDialog);
  $("own").hidden = !state.meta.llm_enabled;
  $("notice").textContent = `Demonstration: AI cases use rules derived from public sources (${state.meta.pack_version}), and fixed test cases use synthetic rules. Neither is official or complete Dubai Municipality/BPS logic. Roles are simulated and documents are fictional. RePermit does not issue permits or replace a competent authority's decision.`;
  // Cases that can run come first; without an LLM the AI cases are greyed out below them.
  const scenarios = await api("/demo/scenarios");
  $("scenarios").replaceChildren(...[...scenarios.filter((item) => item.available), ...scenarios.filter((item) => !item.available)].map(scenarioRow));
  window.addEventListener("hashchange", () => route().catch((error) => toast(error.message)).finally(() => {
    if (state.afterRoute) state.afterRoute();
    state.afterRoute = null;
  }));
  await route();
}

start().catch((error) => toast(error.message));
</script>
</body>
</html>
