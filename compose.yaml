services:
  api:
    build: .
    environment:
      REPERMIT_DATABASE_URL: postgresql+psycopg://repermit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/repermit
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REPERMIT_LLM_PROVIDER: ${REPERMIT_LLM_PROVIDER:-anthropic}
      # A model per AI task. Without a documents model, the review reads documents itself.
      REPERMIT_AI_REVIEW_MODEL: ${REPERMIT_AI_REVIEW_MODEL:-${REPERMIT_LLM_MODEL:-claude-sonnet-5-5}}
      REPERMIT_AI_REVIEW_EFFORT: ${REPERMIT_AI_REVIEW_EFFORT:-high}
      # Calls the review may make to the BIM model tools; 0 switches them off.
      REPERMIT_AI_BIM_TOOL_CALLS: ${REPERMIT_AI_BIM_TOOL_CALLS:-6}
      REPERMIT_AI_DOCUMENTS_MODEL: ${REPERMIT_AI_DOCUMENTS_MODEL:-}
      REPERMIT_AI_DOCUMENTS_EFFORT: ${REPERMIT_AI_DOCUMENTS_EFFORT:-medium}
      # Models that can be chosen on the Settings page.
      REPERMIT_AI_ALLOWED_MODELS: ${REPERMIT_AI_ALLOWED_MODELS:-claude-haiku-5-5,claude-sonnet-5-5,claude-opus-5-5}
      # Hard caps on paid AI calls; a case that hits one goes to a reviewer.
      REPERMIT_CASE_BUDGET_USD: ${REPERMIT_CASE_BUDGET_USD:-1.00}
      REPERMIT_DAILY_BUDGET_USD: ${REPERMIT_DAILY_BUDGET_USD:-5.00}
    volumes:
      # Full source texts stay out of the image. Build them with: python -m repermit.ingest
      - ./knowledge:/app/knowledge:ro
    ports:
      # Loopback only: actor roles are simulated, so the API must not be exposed.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: repermit
      POSTGRES_DB: repermit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repermit -d repermit"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
