[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repermit"
version = "0.1.0"
description = "Assessment and coordination of building-permit design modifications (UC-01)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6,<7",
    "pydantic>=2.8,<3",
    "anthropic>=2.3,<3",
    "ifcopenshell>=0.9,<1",
    "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/repermit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
